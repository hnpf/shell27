# theming
foreground            #f2f2f2
background            #1c1c1e
selection_foreground  #000000
selection_background  #b5d5ff

# Font
font_family      SF Mono
font_size 12.5

# Cursor
cursor_trail 1
cursor                #ffffff
cursor_text_color     #1c1c1e
cursor_shape          block
cursor_blink_interval 0.5

# Padding
window_margin_width 21.75
window_padding_width 6 8
adjust_line_height  115%

# Translucency
background_opacity 0.88
background_blur 20

# No close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C

# Avoid restoring Kitty's default 1920x1081 window size
remember_window_size  no
initial_window_width  950
initial_window_height 600